---
name: Build VirtUI Manager package

on:
  pull_request:
    branches:
      - main
    paths:
      - 'packages/virtui-manager/**'
      - '.github/workflows/build-virtui-manager.yml'
      - '.github/renovate.json5'
      - 'LICENSE_POLICY.md'
  push:
    branches:
      - main
    paths:
      - 'packages/virtui-manager/**'
      - '.github/workflows/build-virtui-manager.yml'
      - 'LICENSE_POLICY.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: virtui-manager-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build VirtUI Manager RPM
    runs-on: ubuntu-24.04
    container:
      image: registry.fedoraproject.org/fedora:44

    steps:
      - name: Install build and test dependencies
        shell: bash
        run: |
          set -euo pipefail
          dnf install -y \
            git \
            python3 \
            python3-pip \
            python3-setuptools \
            python3-wheel \
            python3-packaging \
            python3-libvirt \
            python3-pyyaml \
            python3-requests \
            python3-netifaces \
            python3-gobject \
            python3-pytest \
            python3-pytest-cov \
            libosinfo \
            osinfo-db \
            tmux \
            7zip \
            novnc \
            python3-websockify \
            rpm-build \
            tar \
            gzip \
            file \
            uv
          dnf clean all

      - name: Checkout package repository
        uses: actions/checkout@v6

      - name: Build and test VirtUI Manager RPM
        shell: bash
        run: |
          bash packages/virtui-manager/build.sh

      - name: Upload VirtUI Manager RPM artifact
        uses: actions/upload-artifact@v7
        with:
          name: virtui-manager-noarch
          path: out/virtui-manager/
          if-no-files-found: error
          retention-days: 14

  validate:
    name: Validate VirtUI Manager - ${{ matrix.display_name }}
    needs:
      - build
    runs-on: ubuntu-24.04

    strategy:
      fail-fast: false
      matrix:
        include:
          - id: fedora44
            display_name: Fedora 44
            container: registry.fedoraproject.org/fedora:44
          - id: el10
            display_name: AlmaLinux 10
            container: almalinux:10

    container:
      image: ${{ matrix.container }}

    steps:
      - name: Install validation tools
        shell: bash
        run: |
          set -euo pipefail
          dnf install -y rpm file
          dnf clean all

      - name: Download exact VirtUI Manager RPM artifact
        uses: actions/download-artifact@v7
        with:
          name: virtui-manager-noarch
          path: package

      - name: Verify and install exact RPM
        shell: bash
        run: |
          set -euo pipefail

          (
            cd package
            cat metadata/rpm-sha256.txt
            sha256sum -c metadata/rpm-sha256.txt
          )

          RPM_FILE="$(find package/rpms -maxdepth 1 -type f -name 'virtui-manager-*.noarch.rpm' -print -quit)"
          test -n "${RPM_FILE}"

          dnf install -y "${RPM_FILE}"

          source package/metadata/package.env

          rpm -q virtui-manager
          test -x /usr/bin/virtui-manager
          test -x /usr/bin/vmc
          test -L /usr/bin/virtui-manager-cmd
          test -f /usr/share/licenses/virtui-manager/LICENSE
          test -f /usr/share/licenses/virtui-manager/python/manifest.tsv
          test -d /usr/libexec/virtui-manager/python

          PYTHONPATH=/usr/libexec/virtui-manager/python \
          EXPECTED_VIRTUI="${VERSION}" \
          EXPECTED_TEXTUAL="${TEXTUAL_VERSION}" \
          python3 - <<'PY'
          import importlib.metadata
          import os
          import gi
          import libvirt
          import markdown_it
          import netifaces
          import packaging
          import requests
          import textual
          import vmanager.wrapper
          import yaml

          virtui = importlib.metadata.version("virtui-manager")
          textual_version = importlib.metadata.version("textual")
          print("VirtUI Manager", virtui)
          print("Textual", textual_version)
          assert virtui == os.environ["EXPECTED_VIRTUI"]
          assert textual_version == os.environ["EXPECTED_TEXTUAL"]
          PY

          /usr/bin/vmc --help >/tmp/vmc-help.txt

          if find /usr/libexec/virtui-manager/python -type f -print0 \
              | xargs -0 file | grep -q 'ELF'; then
            echo "ERROR: installed private VirtUI Python tree contains an ELF file" >&2
            exit 1
          fi

          rpm -V virtui-manager

          mkdir -p "package/validation/${{ matrix.id }}"
          cat /etc/os-release > "package/validation/${{ matrix.id }}/os-release.txt"
          rpm -q virtui-manager > "package/validation/${{ matrix.id }}/virtui-manager.txt"
          sha256sum "${RPM_FILE}" > "package/validation/${{ matrix.id }}/rpm-sha256.txt"
          cp /tmp/vmc-help.txt "package/validation/${{ matrix.id }}/vmc-help.txt"
          cp package/metadata/private-python-packages.tsv \
             "package/validation/${{ matrix.id }}/private-python-packages.tsv"

      - name: Upload validation evidence
        uses: actions/upload-artifact@v7
        with:
          name: virtui-manager-validation-${{ matrix.id }}
          path: package/validation/${{ matrix.id }}/
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish verified VirtUI Manager artifact
    needs:
      - build
      - validate
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04

    permissions:
      contents: read
      packages: write

    steps:
      - name: Download validated package artifact
        uses: actions/download-artifact@v7
        with:
          name: virtui-manager-noarch
          path: package

      - name: Read package metadata
        shell: bash
        run: |
          set -euo pipefail
          source package/metadata/package.env

          echo "VIRTUI_MANAGER_VERSION=${VERSION}" >> "${GITHUB_ENV}"
          echo "VIRTUI_MANAGER_COMMIT=${UPSTREAM_COMMIT}" >> "${GITHUB_ENV}"
          echo "TEXTUAL_VERSION=${TEXTUAL_VERSION}" >> "${GITHUB_ENV}"
          echo "PACKAGE_IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/virtui-manager" >> "${GITHUB_ENV}"

      - name: Log in to GHCR
        shell: bash
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          echo "${GHCR_TOKEN}" | docker login ghcr.io -u "${GITHUB_ACTOR}" --password-stdin

      - name: Build package OCI image
        shell: bash
        run: |
          set -euo pipefail

          cat > package/Containerfile <<EOF_CONTAINER
          FROM scratch
          LABEL org.opencontainers.image.title="virtui-manager package artifact" \
                org.opencontainers.image.description="Verified Home Server Project VirtUI Manager RPM, source, licenses, Python lock, and build metadata" \
                org.opencontainers.image.source="https://github.com/${GITHUB_REPOSITORY}" \
                org.opencontainers.image.version="${VIRTUI_MANAGER_VERSION}" \
                io.home-server-project.package="virtui-manager" \
                io.home-server-project.upstream-commit="${VIRTUI_MANAGER_COMMIT}" \
                io.home-server-project.textual-version="${TEXTUAL_VERSION}" \
                io.home-server-project.channel="universal-noarch"
          COPY rpms /rpms
          COPY source /source
          COPY licenses /licenses
          COPY metadata /metadata
          EOF_CONTAINER

          docker build \
            --file package/Containerfile \
            --tag "${PACKAGE_IMAGE}:${VIRTUI_MANAGER_VERSION}-1.hsp" \
            --tag "${PACKAGE_IMAGE}:stable" \
            package

      - name: Publish immutable and stable tags
        shell: bash
        run: |
          set -euo pipefail
          docker push "${PACKAGE_IMAGE}:${VIRTUI_MANAGER_VERSION}-1.hsp"
          docker push "${PACKAGE_IMAGE}:stable"
