---
name: Build UPSide package

on:
  pull_request:
    branches:
      - main
    paths:
      - 'packages/cockpit-upside/**'
      - '.github/workflows/build-upside.yml'
      - '.github/renovate.json5'
      - 'LICENSE_POLICY.md'
  push:
    branches:
      - main
    paths:
      - 'packages/cockpit-upside/**'
      - '.github/workflows/build-upside.yml'
      - 'LICENSE_POLICY.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: upside-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build neutral UPSide RPM
    runs-on: ubuntu-24.04
    container:
      image: registry.fedoraproject.org/fedora:44

    steps:
      - name: Install build dependencies
        shell: bash
        run: |
          set -euo pipefail
          dnf install -y \
            git \
            make \
            nodejs \
            npm \
            rpm-build \
            tar \
            gzip
          dnf clean all

      - name: Checkout package repository
        uses: actions/checkout@v4

      - name: Build neutral RPM
        shell: bash
        run: |
          bash packages/cockpit-upside/build.sh

      - name: Upload neutral RPM artifact
        uses: actions/upload-artifact@v4
        with:
          name: cockpit-upside-neutral
          path: out/cockpit-upside/
          if-no-files-found: error
          retention-days: 14

  validate:
    name: Validate UPSide - ${{ matrix.display_name }}
    needs:
      - build
    runs-on: ubuntu-24.04

    strategy:
      fail-fast: false
      matrix:
        include:
          - id: fedora44
            display_name: Fedora 44
            container: registry.fedoraproject.org/fedora:44
          - id: el10
            display_name: AlmaLinux 10
            container: almalinux:10

    container:
      image: ${{ matrix.container }}

    steps:
      - name: Install validation tools
        shell: bash
        run: |
          set -euo pipefail
          dnf install -y cockpit-bridge rpm
          dnf clean all

      - name: Download exact neutral RPM artifact
        uses: actions/download-artifact@v4
        with:
          name: cockpit-upside-neutral
          path: package

      - name: Verify and install exact RPM
        shell: bash
        run: |
          set -euo pipefail

          cat package/metadata/rpm-sha256.txt
          sha256sum -c package/metadata/rpm-sha256.txt

          RPM_FILE="$(find package/rpms -maxdepth 1 -type f -name 'cockpit-upside-*.noarch.rpm' -print -quit)"
          test -n "${RPM_FILE}"

          dnf install -y "${RPM_FILE}"

          rpm -q cockpit-upside
          test -f /usr/share/cockpit/upside/manifest.json
          test -f /usr/share/metainfo/io.github.deviationist.upside.metainfo.xml
          test -f /usr/share/licenses/cockpit-upside/LICENSE
          test -f /usr/share/licenses/cockpit-upside/index.js.LEGAL.txt
          rpm -V cockpit-upside

          mkdir -p "package/validation/${{ matrix.id }}"
          cat /etc/os-release > "package/validation/${{ matrix.id }}/os-release.txt"
          rpm -q cockpit-bridge > "package/validation/${{ matrix.id }}/cockpit-bridge.txt"
          rpm -q cockpit-upside > "package/validation/${{ matrix.id }}/cockpit-upside.txt"
          sha256sum "${RPM_FILE}" > "package/validation/${{ matrix.id }}/rpm-sha256.txt"

      - name: Upload validation evidence
        uses: actions/upload-artifact@v4
        with:
          name: cockpit-upside-validation-${{ matrix.id }}
          path: package/validation/${{ matrix.id }}/
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish verified UPSide artifact
    needs:
      - build
      - validate
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04

    permissions:
      contents: read
      packages: write

    steps:
      - name: Download validated neutral package artifact
        uses: actions/download-artifact@v4
        with:
          name: cockpit-upside-neutral
          path: package

      - name: Read package metadata
        shell: bash
        run: |
          set -euo pipefail
          source package/metadata/package.env

          echo "UPSIDE_VERSION=${VERSION}" >> "${GITHUB_ENV}"
          echo "UPSIDE_COMMIT=${UPSTREAM_COMMIT}" >> "${GITHUB_ENV}"
          echo "PACKAGE_IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/cockpit-upside" >> "${GITHUB_ENV}"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build package OCI image
        shell: bash
        run: |
          set -euo pipefail

          cat > package/Containerfile <<EOF
          FROM scratch
          LABEL org.opencontainers.image.title="cockpit-upside package artifact" \
                org.opencontainers.image.description="Verified Home Server Project UPSide RPM, source, licenses, and build metadata" \
                org.opencontainers.image.source="https://github.com/${GITHUB_REPOSITORY}" \
                org.opencontainers.image.version="${UPSIDE_VERSION}" \
                io.home-server-project.package="cockpit-upside" \
                io.home-server-project.upstream-commit="${UPSIDE_COMMIT}" \
                io.home-server-project.channel="universal"
          COPY rpms /rpms
          COPY source /source
          COPY licenses /licenses
          COPY metadata /metadata
          EOF

          docker build \
            --file package/Containerfile \
            --tag "${PACKAGE_IMAGE}:${UPSIDE_VERSION}-1.hsp" \
            --tag "${PACKAGE_IMAGE}:stable" \
            package

      - name: Publish immutable and stable tags
        shell: bash
        run: |
          set -euo pipefail
          docker push "${PACKAGE_IMAGE}:${UPSIDE_VERSION}-1.hsp"
          docker push "${PACKAGE_IMAGE}:stable"
