---
name: Build mergerfs x86-64-v2 package

on:
  pull_request:
    branches:
      - main
    paths:
      - 'packages/mergerfs/**'
      - '.github/workflows/build-mergerfs.yml'
      - '.github/renovate.json5'
      - 'LICENSE_POLICY.md'
      - 'README.md'
  push:
    branches:
      - main
    paths:
      - 'packages/mergerfs/**'
      - '.github/workflows/build-mergerfs.yml'
      - '.github/renovate.json5'
      - 'LICENSE_POLICY.md'
      - 'README.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mergerfs-v2-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  ALMA_IMAGE: quay.io/almalinuxorg/10-base:10

jobs:
  build:
    name: Build mergerfs x86-64-v2
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout package repository
        uses: actions/checkout@v6

      - name: Install container tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y podman skopeo

      - name: Resolve AlmaLinux x86-64-v2 build image
        shell: bash
        run: |
          set -euo pipefail

          digest="$(skopeo inspect \
            --override-arch amd64 \
            --override-variant v2 \
            --format '{{.Digest}}' \
            "docker://${ALMA_IMAGE}")"
          [[ "${digest}" =~ ^sha256:[0-9a-f]{64}$ ]]

          echo "ALMA_REF=${ALMA_IMAGE%:*}@${digest}" >> "${GITHUB_ENV}"
          echo "Resolved linux/amd64/v2 build image: ${ALMA_IMAGE%:*}@${digest}"

      - name: Build and validate mergerfs x86-64-v2 RPM
        shell: bash
        run: |
          set -euo pipefail

          sudo podman run --rm --privileged \
            --platform linux/amd64/v2 \
            --device /dev/fuse \
            -v "${GITHUB_WORKSPACE}:/workspace" \
            -w /workspace \
            "${ALMA_REF}" \
            /bin/bash -lc '
              set -euo pipefail
              dnf install -y \
                binutils \
                file \
                findutils \
                fuse3 \
                gcc-c++ \
                git \
                gzip \
                libatomic \
                make \
                rpm-build \
                tar \
                util-linux \
                which
              dnf clean all
              bash packages/mergerfs/build.sh
            '

      - name: Verify v2 artifact
        shell: bash
        run: |
          set -euo pipefail
          grep -Fqx 'x86_64_v2' out/mergerfs/metadata/rpm-arch.txt
          (
            cd out/mergerfs
            sha256sum -c metadata/SHA256SUMS
            sha256sum -c metadata/rpm-sha256.txt
          )

      - name: Upload mergerfs x86-64-v2 package artifact
        uses: actions/upload-artifact@v7
        with:
          name: mergerfs-x86_64_v2
          path: out/mergerfs/
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish mergerfs x86-64-v2
    needs:
      - build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write

    steps:
      - name: Download validated mergerfs x86-64-v2 artifact
        uses: actions/download-artifact@v7
        with:
          name: mergerfs-x86_64_v2
          path: package

      - name: Reverify package and metadata
        shell: bash
        run: |
          set -euo pipefail
          (
            cd package
            sha256sum -c metadata/SHA256SUMS
            sha256sum -c metadata/rpm-sha256.txt
          )

          source package/metadata/package.env
          [[ "${PACKAGE}" == "mergerfs" ]]
          [[ "${RPM_ARCH}" == "x86_64_v2" ]]
          [[ "${PACKAGE_CHANNEL}" == "el10-x86_64_v2" ]]
          [[ "${UPSTREAM_COMMIT}" =~ ^[0-9a-f]{40}$ ]]

          echo "MERGERFS_VERSION=${VERSION}" >> "${GITHUB_ENV}"
          echo "MERGERFS_COMMIT=${UPSTREAM_COMMIT}" >> "${GITHUB_ENV}"
          echo "PACKAGE_IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/mergerfs" >> "${GITHUB_ENV}"

      - name: Log in to GHCR
        shell: bash
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          echo "${GHCR_TOKEN}" | docker login ghcr.io \
            -u "${GITHUB_ACTOR}" \
            --password-stdin

      - name: Build package OCI artifact
        shell: bash
        run: |
          set -euo pipefail
          immutable_tag="${MERGERFS_VERSION}-1.hsp-v2"

          cat > package/Containerfile <<EOF
          FROM scratch
          LABEL org.opencontainers.image.title="mergerfs x86-64-v2 package artifact" \
                org.opencontainers.image.description="Verified Home Server Project mergerfs x86-64-v2 RPM, source, license, and build metadata" \
                org.opencontainers.image.source="https://github.com/${GITHUB_REPOSITORY}" \
                org.opencontainers.image.version="${MERGERFS_VERSION}" \
                io.home-server-project.package="mergerfs" \
                io.home-server-project.upstream-commit="${MERGERFS_COMMIT}" \
                io.home-server-project.rpm-arch="x86_64_v2" \
                io.home-server-project.channel="el10-x86_64_v2"
          COPY rpms /rpms
          COPY source /source
          COPY licenses /licenses
          COPY metadata /metadata
          EOF

          docker build \
            --file package/Containerfile \
            --tag "${PACKAGE_IMAGE}:${immutable_tag}" \
            --tag "${PACKAGE_IMAGE}:stable-v2" \
            package

          echo "IMMUTABLE_TAG=${immutable_tag}" >> "${GITHUB_ENV}"

      - name: Publish immutable and stable-v2 tags
        shell: bash
        run: |
          set -euo pipefail
          docker push "${PACKAGE_IMAGE}:${IMMUTABLE_TAG}"
          docker push "${PACKAGE_IMAGE}:stable-v2"
