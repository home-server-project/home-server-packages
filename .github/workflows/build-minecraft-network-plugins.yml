---
name: Build Minecraft Network Plugins

on:
  pull_request:
    branches: [main]
    paths:
      - 'packages/minecraft-network-plugins/**'
      - '.github/workflows/build-minecraft-network-plugins.yml'
      - '.github/workflows/update-minecraft-network-plugins.yml'
      - 'LICENSE_POLICY.md'
  push:
    branches: [main]
    paths:
      - 'packages/minecraft-network-plugins/**'
      - '.github/workflows/build-minecraft-network-plugins.yml'
      - 'LICENSE_POLICY.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: minecraft-network-plugins-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - name: Test dependency updater and payload validation
        run: python3 -B -m unittest discover -s packages/minecraft-network-plugins/tests -v
      - name: Build and test lobby with reviewed dependencies
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash packages/minecraft-network-plugins/build.sh
      - uses: actions/upload-artifact@v7
        with:
          name: minecraft-network-plugins
          path: out/minecraft-network-plugins/
          if-no-files-found: error
          retention-days: 14

  validate:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v7
        with:
          name: minecraft-network-plugins
          path: package
      - name: Validate exact artifact
        run: python3 -B packages/minecraft-network-plugins/validate.py package

  publish:
    needs: [build, validate]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v7
        with:
          name: minecraft-network-plugins
          path: package
      - name: Reverify exact payload and derive composition tag
        run: |
          set -euo pipefail
          python3 -B packages/minecraft-network-plugins/validate.py package
          composition="$(sha256sum package/metadata/SHA256SUMS | cut -d ' ' -f1)"
          echo "COMPOSITION_TAG=composition-${composition}" >> "${GITHUB_ENV}"
          echo 'PACKAGE_IMAGE=ghcr.io/home-server-project/minecraft-network-plugins' >> "${GITHUB_ENV}"
      - name: Log in to GHCR
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "${GHCR_TOKEN}" | docker login ghcr.io -u "${GITHUB_ACTOR}" --password-stdin
      - name: Publish validated composition and stable channel
        run: |
          set -euo pipefail
          docker build -f packages/minecraft-network-plugins/Containerfile \
            --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
            --tag "${PACKAGE_IMAGE}:${COMPOSITION_TAG}" --tag "${PACKAGE_IMAGE}:stable" package
          docker push "${PACKAGE_IMAGE}:${COMPOSITION_TAG}"
          docker push "${PACKAGE_IMAGE}:stable"
